<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗号玩家</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold-light:#ffe6b3;--gold:#d4af37;--gold-dark:#8b7355;--bg:#020617}
body{background:var(--bg);width:100vw;height:100vh;overflow:hidden;font-family:'Noto Serif SC','Noto Sans SC',serif}
#starCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#threeCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}
.ui-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(20px,5vw,60px)}
.ui-layer>*{pointer-events:auto}
.title-block{text-align:center;opacity:0;animation:fadeInDown 1.2s cubic-bezier(0.16,1,0.3,1) 0.5s forwards}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.main-title{font-family:'Noto Serif SC',serif;font-size:clamp(36px,7vw,80px);font-weight:900;background:linear-gradient(180deg,#ffe6b3 0%,#d4af37 50%,#8b7355 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 40px rgba(212,175,55,0.5),0 0 80px rgba(212,175,55,0.3),0 0 120px rgba(212,175,55,0.15),0 2px 4px rgba(0,0,0,0.6);filter:drop-shadow(0 0 20px rgba(212,175,55,0.4))}
.deco-line{width:clamp(80px,15vw,200px);height:2px;background:linear-gradient(90deg,transparent,var(--gold-light),var(--gold),var(--gold-light),transparent);margin:clamp(12px,2vw,24px) auto;opacity:0;animation:fadeIn 0.8s ease 1s forwards;box-shadow:0 0 12px rgba(212,175,55,0.5)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.subtitle-text{font-family:'Noto Serif SC','Noto Sans SC',serif;font-size:clamp(14px,2.5vw,22px);font-weight:400;color:var(--gold-dark);letter-spacing:clamp(2px,0.5vw,6px);opacity:0;animation:fadeIn 0.8s ease 1.5s forwards;text-shadow:0 0 10px rgba(139,115,85,0.3)}
.btn-block{opacity:0;animation:fadeIn 0.8s ease 2.5s forwards;margin-top:clamp(24px,4vw,48px)}
.hex-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:clamp(80px,18vw,140px);height:clamp(46px,10vw,80px);background:rgba(212,175,55,0.05);border:2px solid rgba(212,175,55,0.5);color:var(--gold);font-family:'Noto Serif SC',serif;font-size:clamp(16px,3.5vw,28px);font-weight:700;letter-spacing:0.3em;cursor:pointer;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);text-shadow:0 0 10px rgba(212,175,55,0.4);overflow:hidden}
.hex-btn:hover{background:rgba(212,175,55,0.12);border-color:var(--gold-light);box-shadow:0 0 30px rgba(212,175,55,0.35),0 0 60px rgba(212,175,55,0.15),inset 0 0 30px rgba(212,175,55,0.08);transform:scale(1.05);color:var(--gold-light)}
.hex-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,230,179,0.3),transparent);transition:left 0.6s ease}
.hex-btn:hover::after{left:100%}
.hex-btn:active{transform:scale(0.96)}
.bottom-note{position:absolute;bottom:clamp(20px,4vw,40px);opacity:0;animation:fadeIn 0.8s ease 3s forwards;text-align:center}
.bottom-note p{font-family:'Noto Sans SC',sans-serif;font-size:clamp(11px,1.8vw,14px);color:rgba(139,115,85,0.6);letter-spacing:0.15em;font-weight:300}
@media(max-width:480px){.hex-btn{clip-path:polygon(50% 5%,95% 28%,95% 72%,50% 95%,5% 72%,5% 28%)}}
</style>
</head>
<body>
<canvas id="starCanvas"></canvas>
<canvas id="threeCanvas"></canvas>

<div class="ui-layer">
    <div class="title-block">
        <h1 class="main-title">暗号玩家</h1>
        <div class="deco-line"></div>
        <p class="subtitle-text">顶级人生，从放下投机白嫖开始。</p>
    </div>
    <div class="btn-block">
        <button class="hex-btn" onclick="location.href='app.html'">进入</button>
    </div>
    <div class="bottom-note">
        <p>帮助大学生构建顶级的社交思维——价值交换。</p>
    </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const starCanvas = document.getElementById('starCanvas');
const sctx = starCanvas.getContext('2d');
let stars = [];

function resizeStarCanvas() {
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
}
resizeStarCanvas();
window.addEventListener('resize', resizeStarCanvas);

class Star {
    constructor() { this.reset(true); }
    reset(init) {
        this.x = Math.random() * starCanvas.width;
        this.y = init ? Math.random() * starCanvas.height : -5;
        this.size = Math.random() * 2.2 + 0.3;
        this.speed = Math.random() * 0.4 + 0.1;
        this.opacity = Math.random() * 0.7 + 0.15;
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
        this.twinklePhase = Math.random() * Math.PI * 2;
    }
    update() {
        this.y += this.speed;
        if (this.y > starCanvas.height + 5) this.reset(false);
        this.twinklePhase += this.twinkleSpeed;
    }
    draw(ctx) {
        const alpha = this.opacity * (0.6 + 0.4 * Math.sin(this.twinklePhase));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212,175,55,${alpha})`;
        ctx.fill();
        if (this.size > 1.2) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(212,175,55,${alpha * 0.12})`;
            ctx.fill();
        }
    }
}

for (let i = 0; i < 200; i++) stars.push(new Star());

const threeCanvas = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(0, 0.3, 9);
camera.lookAt(0, 0, 0);

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});

let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
document.addEventListener('mousemove', e => {
    targetX = (e.clientX / window.innerWidth - 0.5) * 0.6;
    targetY = (e.clientY / window.innerHeight - 0.5) * 0.3;
});

function createGlowTexture(color, size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const cx = c.getContext('2d');
    const grad = cx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, color);
    grad.addColorStop(0.1, color);
    grad.addColorStop(0.4, 'rgba(0,0,0,0.3)');
    grad.addColorStop(0.7, 'rgba(0,0,0,0.05)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = grad;
    cx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
}

const glowTex = createGlowTexture('rgba(255,230,179,0.9)', 64);
const sandglassGroup = new THREE.Group();
scene.add(sandglassGroup);

const particlesGeo = new THREE.BufferGeometry();
const positions = [];
const colors = [];
const RINGS = 80, POINTS = 60, Y_MIN = -5, Y_MAX = 5;
const goldColors = [
    new THREE.Color('#ffe6b3'), new THREE.Color('#d4af37'), new THREE.Color('#8b7355'),
    new THREE.Color('#c9a84c'), new THREE.Color('#f0d78c')
];

let allPoints = [];

for (let r = 0; r < RINGS; r++) {
    const t = r / (RINGS - 1);
    const y = Y_MIN + t * (Y_MAX - Y_MIN);
    const radius = 0.4 + 2.2 * Math.pow(Math.abs(t - 0.5) * 2, 1.2);
    const ring = [];
    for (let p = 0; p < POINTS; p++) {
        const angle = (p / POINTS) * Math.PI * 2;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        positions.push(x, y, z);
        const ci = Math.floor(Math.random() * goldColors.length);
        const col = goldColors[ci].clone();
        col.multiplyScalar(0.7 + Math.random() * 0.3);
        colors.push(col.r, col.g, col.b);
        ring.push({ x, y, z, idx: positions.length / 3 - 1 });
    }
    allPoints.push(ring);
}

particlesGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
particlesGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

const particlesMat = new THREE.PointsMaterial({
    size: 0.06, map: glowTex, blending: THREE.AdditiveBlending,
    depthWrite: false, vertexColors: true, transparent: true, opacity: 0.85,
});
sandglassGroup.add(new THREE.Points(particlesGeo, particlesMat));

const lngLineGroup = new THREE.Group();
for (let r = 0; r < RINGS - 1; r++) {
    for (let p = 0; p < POINTS; p++) {
        const a = allPoints[r][p], b = allPoints[r + 1][p];
        if (Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z) > 1.5) continue;
        const lnGeo = new THREE.BufferGeometry();
        lnGeo.setAttribute('position', new THREE.Float32BufferAttribute([a.x,a.y,a.z,b.x,b.y,b.z], 3));
        lngLineGroup.add(new THREE.Line(lnGeo, new THREE.LineBasicMaterial({
            color: 0x8b7355, transparent: true, opacity: 0.15,
            blending: THREE.AdditiveBlending, depthWrite: false,
        })));
    }
}
sandglassGroup.add(lngLineGroup);

const latLineGroup = new THREE.Group();
for (let r = 0; r < RINGS; r++) {
    const lnGeo = new THREE.BufferGeometry();
    const pts = [];
    for (let p = 0; p < POINTS; p++) { const pt = allPoints[r][p]; pts.push(pt.x, pt.y, pt.z); }
    pts.push(allPoints[r][0].x, allPoints[r][0].y, allPoints[r][0].z);
    lnGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    const t = r / (RINGS - 1), alpha = t < 0.5 ? t * 2 : (1 - t) * 2;
    latLineGroup.add(new THREE.Line(lnGeo, new THREE.LineBasicMaterial({
        color: 0xd4af37, transparent: true, opacity: 0.08 + alpha * 0.12,
        blending: THREE.AdditiveBlending, depthWrite: false,
    })));
}
sandglassGroup.add(latLineGroup);

const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffe6b3, transparent: true, opacity: 0.9 }));
sandglassGroup.add(sphere);

const glow1 = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
sandglassGroup.add(glow1);

const glow2 = new THREE.Mesh(new THREE.SphereGeometry(0.75, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending, depthWrite: false }));
sandglassGroup.add(glow2);

const ambientGeo = new THREE.BufferGeometry();
const ambientPos = [], ambientCol = [];
for (let i = 0; i < 300; i++) {
    const phi = Math.random() * Math.PI * 2, theta = Math.random() * Math.PI, r = 0.3 + Math.random() * 1.2;
    ambientPos.push(Math.cos(phi) * Math.sin(theta) * r, Math.cos(theta) * r * 0.6, Math.sin(phi) * Math.sin(theta) * r);
    ambientCol.push(1, 0.88 + Math.random() * 0.12, 0.65 + Math.random() * 0.35);
}
ambientGeo.setAttribute('position', new THREE.Float32BufferAttribute(ambientPos, 3));
ambientGeo.setAttribute('color', new THREE.Float32BufferAttribute(ambientCol, 3));
const ambientCloud = new THREE.Points(ambientGeo, new THREE.PointsMaterial({
    size: 0.03, map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, vertexColors: true, transparent: true, opacity: 0.5,
}));
sandglassGroup.add(ambientCloud);

const clock = new THREE.Clock();
let particleOpacity = 0;

function animate() {
    requestAnimationFrame(animate);
    const time = performance.now() * 0.001;
    const dt = Math.min(clock.getDelta(), 0.1);

    sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    stars.forEach(s => { s.update(); s.draw(sctx); });

    mouseX += (targetX - mouseX) * 0.03;
    mouseY += (targetY - mouseY) * 0.03;

    sandglassGroup.rotation.y += 0.003;
    sandglassGroup.rotation.x = mouseY * 0.4;
    sandglassGroup.rotation.z = -mouseX * 0.2;

    const pulse = 1 + Math.sin(time * 1.8) * 0.15 + Math.sin(time * 3.3) * 0.08;
    sphere.scale.setScalar(pulse);
    sphere.material.opacity = 0.75 + Math.sin(time * 2.2) * 0.25;
    glow1.scale.setScalar(pulse * 0.9 + 0.1);
    glow1.material.opacity = 0.2 + Math.sin(time * 1.5) * 0.1;
    glow2.scale.setScalar(pulse * 0.7 + 0.3);
    glow2.rotation.y += 0.004;
    glow2.rotation.x += 0.002;
    ambientCloud.rotation.y += 0.002;
    ambientCloud.rotation.x += 0.001;

    particleOpacity = Math.min(1, particleOpacity + dt * 0.5);
    particlesMat.opacity = 0.85 * particleOpacity;
    ambientCloud.material.opacity = 0.5 * particleOpacity;

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
