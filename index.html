<html lang="zh-CN">
<head>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold-light:#ffe6b3;--gold:#d4af37;--gold-mid:#c9a84c;--gold-dark:#8b7355;--bg:#020617}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Noto Serif SC','Noto Sans SC',serif;cursor:default;user-select:none;-webkit-user-select:none}

#starCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
#threeCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none}

.top-nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,40px);padding:clamp(14px,2.5vh,28px) clamp(20px,5vw,60px);opacity:0;animation:fadeIn 0.8s ease 0.8s forwards}
.top-nav a{font-family:'Noto Sans SC',sans-serif;font-size:clamp(12px,1.5vw,15px);font-weight:400;color:var(--gold-dark);text-decoration:none;letter-spacing:0.12em;transition:all 0.3s ease;position:relative;padding:4px 0}
.top-nav a::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:1px;background:var(--gold);transition:width 0.3s ease;box-shadow:0 0 6px var(--gold)}
.top-nav a:hover{color:var(--gold-light);text-shadow:0 0 12px rgba(212,175,55,0.5)}
.top-nav a:hover::after{width:100%}
.top-nav a.active{color:var(--gold);text-shadow:0 0 8px rgba(212,175,55,0.4)}
.nav-brand{font-family:'Noto Serif SC',serif;font-size:clamp(14px,1.8vw,18px);font-weight:700;color:var(--gold-light);letter-spacing:0.2em;margin-right:clamp(16px,3vw,40px)}

.side-dots{position:fixed;left:clamp(16px,3vw,40px);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.5vh,28px);opacity:0;animation:fadeIn 0.8s ease 1.2s forwards}
.side-dot{width:clamp(6px,1vw,10px);height:clamp(6px,1vw,10px);border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(212,175,55,0.6),0 0 20px rgba(212,175,55,0.2);transition:all 0.4s ease;cursor:pointer}
.side-dot.dim{background:rgba(139,115,85,0.4);box-shadow:0 0 4px rgba(139,115,85,0.2)}
.side-dot:hover{transform:scale(1.6);box-shadow:0 0 16px rgba(212,175,55,0.8),0 0 32px rgba(212,175,55,0.3)}
.side-dot:nth-child(1){animation:dotPulse 2.4s ease-in-out 1.8s infinite}
.side-dot:nth-child(2){animation:dotPulse 2.4s ease-in-out 2.0s infinite}
.side-dot:nth-child(3){animation:dotBoost 2.4s ease-in-out 1.8s infinite}
.side-dot:nth-child(4){animation:dotPulse 2.4s ease-in-out 2.2s infinite}
.side-dot:nth-child(5){animation:dotPulse 2.4s ease-in-out 2.4s infinite}
@keyframes dotPulse{0%,100%{box-shadow:0 0 4px rgba(139,115,85,0.2)}50%{box-shadow:0 0 10px rgba(212,175,55,0.5),0 0 20px rgba(212,175,55,0.15)}}
@keyframes dotBoost{0%,100%{box-shadow:0 0 14px rgba(212,175,55,0.8),0 0 28px rgba(212,175,55,0.4)}50%{box-shadow:0 0 24px rgba(212,175,55,0.95),0 0 42px rgba(212,175,55,0.55),0 0 60px rgba(255,230,179,0.15)}}

.hero-text{position:fixed;top:clamp(8vh,12vh,16vh);left:50%;transform:translateX(-50%);z-index:15;text-align:center;pointer-events:none}
.main-title{font-family:'Noto Serif SC',serif;font-size:clamp(38px,7vw,80px);font-weight:900;background:linear-gradient(180deg,#fff3d6 0%,#ffe6b3 20%,#d4af37 50%,#a67c1e 80%,#7a5a0a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;opacity:0;animation:fadeInDown 1.2s cubic-bezier(0.16,1,0.3,1) 0.3s forwards,titleGlow 3s ease-in-out 1.8s infinite;letter-spacing:0.15em}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 30px rgba(212,175,55,0.5)) drop-shadow(0 0 60px rgba(212,175,55,0.25))}50%{filter:drop-shadow(0 0 45px rgba(212,175,55,0.7)) drop-shadow(0 0 80px rgba(212,175,55,0.4)) drop-shadow(0 0 120px rgba(255,230,179,0.2))}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:translateY(0)}}
.deco-line{width:clamp(100px,18vw,240px);height:1.5px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.6),var(--gold-light),rgba(212,175,55,0.6),transparent);margin:clamp(8px,1.5vh,20px) auto;opacity:0;animation:fadeIn 0.6s ease 0.9s forwards,lineShimmer 3s ease-in-out 1.8s infinite;box-shadow:0 0 10px rgba(212,175,55,0.4)}
@keyframes lineShimmer{0%,100%{box-shadow:0 0 10px rgba(212,175,55,0.4);opacity:1}50%{box-shadow:0 0 22px rgba(212,175,55,0.65),0 0 36px rgba(255,230,179,0.2);opacity:0.85}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.subtitle-text{font-family:'Noto Sans SC',sans-serif;font-size:clamp(14px,2.5vw,22px);font-weight:300;color:rgba(201,168,76,0.8);letter-spacing:clamp(3px,0.6vw,8px);opacity:0;animation:fadeIn 0.6s ease 1.4s forwards;text-shadow:0 0 8px rgba(139,115,85,0.2)}

.enter-section{position:fixed;bottom:clamp(10vh,14vh,22vh);left:50%;transform:translateX(-50%);z-index:15;opacity:0;animation:fadeIn 0.8s ease 2s forwards}
.enter-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:clamp(100px,22vw,170px);height:clamp(40px,8vw,58px);background:rgba(212,175,55,0.04);border:1.5px solid rgba(212,175,55,0.5);color:var(--gold-light);font-family:'Noto Serif SC',serif;font-size:clamp(15px,3vw,26px);font-weight:600;letter-spacing:0.4em;cursor:pointer;transition:all 0.5s cubic-bezier(0.16,1,0.3,1);text-shadow:0 0 12px rgba(212,175,55,0.5);overflow:hidden;border-radius:2px;backdrop-filter:blur(4px);animation:btnBreathe 2.8s ease-in-out 2.8s infinite}
@keyframes btnBreathe{0%,100%{border-color:rgba(212,175,55,0.5);box-shadow:0 0 20px rgba(212,175,55,0.1)}50%{border-color:rgba(212,175,55,0.75);box-shadow:0 0 32px rgba(212,175,55,0.18),0 0 50px rgba(212,175,55,0.06)}}
.enter-btn:hover{background:rgba(212,175,55,0.1);border-color:var(--gold-light);box-shadow:0 0 40px rgba(212,175,55,0.35),0 0 80px rgba(212,175,55,0.12),inset 0 0 30px rgba(212,175,55,0.06);transform:scale(1.04)}
.enter-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,230,179,0.25),transparent);transition:left 0.7s ease}
.enter-btn:hover::after{left:100%}
.enter-btn:active{transform:scale(0.95)}

.bottom-tag{position:fixed;bottom:clamp(18px,3vh,32px);left:50%;transform:translateX(-50%);z-index:15;opacity:0;animation:fadeIn 0.6s ease 2.5s forwards;pointer-events:none}
.bottom-tag span{font-family:'Noto Sans SC',sans-serif;font-size:clamp(10px,1.5vw,13px);color:rgba(139,115,85,0.5);letter-spacing:0.2em;font-weight:300}

@media(max-width:768px){
  .top-nav{justify-content:flex-start;overflow-x:auto;gap:clamp(10px,2vw,20px);padding:12px 16px;mask-image:linear-gradient(90deg,#000 80%,transparent)}
  .nav-brand{font-size:14px;margin-right:12px}
  .side-dots{left:10px;gap:12px}
  .side-dot{width:5px;height:5px}
}
</style>

<script type="module">
import * as THREE from 'three';

// ============ Canvas 2D Starfield ============
const starCanvas = document.getElementById('starCanvas');
const sctx = starCanvas.getContext('2d');
let stars = [];

function resizeStarCanvas() {
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
}
resizeStarCanvas();
window.addEventListener('resize', resizeStarCanvas);

class Star {
    constructor() { this.reset(true); }
    reset(init) {
        this.x = Math.random() * starCanvas.width;
        this.y = init ? Math.random() * starCanvas.height : -8;
        this.size = Math.random() * 2 + 0.3;
        this.speed = Math.random() * 0.35 + 0.08;
        this.opacity = Math.random() * 0.6 + 0.1;
        this.twinkleSpeed = Math.random() * 0.025 + 0.004;
        this.twinklePhase = Math.random() * Math.PI * 2;
        this.hue = Math.random() < 0.7 ? 42 : (Math.random() < 0.5 ? 30 : 50);
    }
    update() {
        this.y += this.speed;
        if (this.y > starCanvas.height + 8) this.reset(false);
        this.twinklePhase += this.twinkleSpeed;
    }
    draw(ctx) {
        const alpha = this.opacity * (0.55 + 0.45 * Math.sin(this.twinklePhase));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue},70%,60%,${alpha})`;
        ctx.fill();
        if (this.size > 1) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 2.8, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue},70%,55%,${alpha * 0.08})`;
            ctx.fill();
        }
    }
}
for (let i = 0; i < 180; i++) stars.push(new Star());

// Shooting stars
class ShootingStar {
    constructor() { this.reset(true); }
    reset(init) {
        this.active = false;
        if (!init && Math.random() < 0.012) this.spawn();
    }
    spawn() {
        this.x = Math.random() * starCanvas.width * 0.7;
        this.y = Math.random() * starCanvas.height * 0.5;
        this.vx = (Math.random() * 3 + 4) * (Math.random() < 0.5 ? 1 : -1);
        this.vy = Math.random() * 1.5 + 1;
        this.length = Math.random() * 80 + 60;
        this.life = 1;
        this.alive = true;
    }
    update() {
        if (!this.alive) return this.reset(false);
        this.x += this.vx; this.y += this.vy;
        this.life -= 0.018;
        if (this.life <= 0 || this.x < -100 || this.x > starCanvas.width + 100 || this.y > starCanvas.height + 100) this.alive = false;
    }
    draw(ctx) {
        if (!this.alive) return;
        const ax = this.life * 0.4 + 0.3;
        const grad = ctx.createLinearGradient(this.x, this.y, this.x - this.vx * 12, this.y - this.vy * 12);
        grad.addColorStop(0, `rgba(255,230,179,${ax})`);
        grad.addColorStop(0.5, `rgba(212,175,55,${ax * 0.4})`);
        grad.addColorStop(1, 'rgba(212,175,55,0)');
        ctx.strokeStyle = grad; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x - this.vx * 12, this.y - this.vy * 12); ctx.stroke();
    }
}
const shootingStars = [];
for (let i = 0; i < 3; i++) shootingStars.push(new ShootingStar());

// ============ Three.js Organic Ring Energy Structure ============
const threeCanvas = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(0, 1.5, 8.5);
camera.lookAt(0, -0.5, 0);

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});

let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
document.addEventListener('mousemove', e => {
    targetX = (e.clientX / window.innerWidth - 0.5) * 0.5;
    targetY = (e.clientY / window.innerHeight - 0.5) * 0.25;
});

function createGlowTexture(color, size) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const cx = c.getContext('2d');
    const grad = cx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, color);
    grad.addColorStop(0.08, color);
    grad.addColorStop(0.35, 'rgba(180,140,60,0.4)');
    grad.addColorStop(0.65, 'rgba(100,70,30,0.08)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = grad;
    cx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
}
const glowTex = createGlowTexture('rgba(255,230,179,0.95)', 64);

const mainGroup = new THREE.Group();
scene.add(mainGroup);

// Build organic wave rings - gravity well structure
const RING_LAYERS = 7;
const PARTICLES_PER_RING = 280;
const allParticleData = [];

// Helper: wave-perturbed radius at angle theta for a given ring
function waveRadius(theta, layerIndex, layerCount, time, globalAmp) {
    const baseR = 1.4 + Math.sin((layerIndex / layerCount) * Math.PI) * 1.2;
    const waves = 2 + layerIndex;
    const amp = (0.45 + layerIndex * 0.1) * globalAmp;
    return baseR
         + Math.sin(waves * theta + time * 0.4 + layerIndex * 1.2) * amp
         + Math.sin(waves * 2.3 * theta + time * 0.6 + layerIndex * 2.1) * amp * 0.65
         + Math.sin(waves * 0.7 * theta - time * 0.25 + layerIndex * 0.5) * amp * 0.4;
}

// Create ring layers
for (let l = 0; l < RING_LAYERS; l++) {
    const t = l / (RING_LAYERS - 1);
    const baseY = -2.8 + t * 5.6;
    const tiltX = (t - 0.5) * 0.6;
    const tiltZ = 0.15 + t * 0.3;
    const ringData = [];

    const positions = [];
    const colors = [];
    const goldColors = [
        new THREE.Color('#ffe6b3'), new THREE.Color('#d4af37'), new THREE.Color('#c9a84c'),
        new THREE.Color('#f0d78c'), new THREE.Color('#8b7355')
    ];

    for (let p = 0; p < PARTICLES_PER_RING; p++) {
        const theta = (p / PARTICLES_PER_RING) * Math.PI * 2;
        const r = waveRadius(theta, l, RING_LAYERS - 1, 0, 1);
        const localX = Math.cos(theta) * r;
        const localZ = Math.sin(theta) * r;
        // Apply tilt
        const cosTX = Math.cos(tiltX), sinTX = Math.sin(tiltX);
        const cosTZ = Math.cos(tiltZ), sinTZ = Math.sin(tiltZ);
        const rx = localX * cosTZ - localZ * sinTZ;
        const rz = localX * sinTZ + localZ * cosTZ;
        const ry = baseY + localZ * sinTX;
        const fx = rx;
        const fy = ry * cosTX - localZ * sinTX;
        const fz = rz;

        positions.push(fx, fy, fz);
        const ci = Math.floor(Math.random() * goldColors.length);
        const col = goldColors[ci].clone().multiplyScalar(0.65 + Math.random() * 0.35);
        colors.push(col.r, col.g, col.b);
        ringData.push({ x: fx, y: fy, z: fz, theta, baseR: r, layerIndex: l });
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
        size: 0.045, map: glowTex, blending: THREE.AdditiveBlending,
        depthWrite: false, vertexColors: true, transparent: true, opacity: 0.85,
    });
    mainGroup.add(new THREE.Points(geo, mat));
    allParticleData.push({ positions: new Float32Array(positions), ringData, layerIndex: l, baseY, tiltX, tiltZ });
}

// Create connection lines within each ring (weblike)
for (let l = 0; l < RING_LAYERS; l++) {
    const data = allParticleData[l];
    const linePositions = [];
    const pts = data.ringData;
    for (let i = 0; i < pts.length; i++) {
        const j = (i + 1) % pts.length;
        linePositions.push(pts[i].x, pts[i].y, pts[i].z, pts[j].x, pts[j].y, pts[j].z);
        // Cross connections every 8 particles
        if (i % 8 === 0) {
            const k = (i + 8) % pts.length;
            linePositions.push(pts[i].x, pts[i].y, pts[i].z, pts[k].x, pts[k].y, pts[k].z);
        }
    }
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    const alpha = 0.06 + (l / RING_LAYERS) * 0.08;
    const lineMat = new THREE.LineBasicMaterial({
        color: 0xd4af37, transparent: true, opacity: alpha,
        blending: THREE.AdditiveBlending, depthWrite: false,
    });
    mainGroup.add(new THREE.LineSegments(lineGeo, lineMat));
}

// Inter-ring vertical connection lines
for (let l = 0; l < RING_LAYERS - 1; l++) {
    const ptsA = allParticleData[l].ringData;
    const ptsB = allParticleData[l + 1].ringData;
    const interPositions = [];
    const step = Math.floor(PARTICLES_PER_RING / 40);
    for (let i = 0; i < PARTICLES_PER_RING; i += step) {
        const a = ptsA[i], b = ptsB[i];
        interPositions.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
    const interGeo = new THREE.BufferGeometry();
    interGeo.setAttribute('position', new THREE.Float32BufferAttribute(interPositions, 3));
    const interMat = new THREE.LineBasicMaterial({
        color: 0x8b7355, transparent: true, opacity: 0.06,
        blending: THREE.AdditiveBlending, depthWrite: false,
    });
    mainGroup.add(new THREE.LineSegments(interGeo, interMat));
}

// Central core glow
const coreGeo = new THREE.SphereGeometry(0.15, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0xffe6b3, transparent: true, opacity: 0.9 });
const core = new THREE.Mesh(coreGeo, coreMat);
mainGroup.add(core);

const glow1Geo = new THREE.SphereGeometry(0.3, 32, 32);
const glow1Mat = new THREE.MeshBasicMaterial({
    color: 0xd4af37, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false,
});
const glow1 = new THREE.Mesh(glow1Geo, glow1Mat);
mainGroup.add(glow1);

const glow2Geo = new THREE.SphereGeometry(0.55, 32, 32);
const glow2Mat = new THREE.MeshBasicMaterial({
    color: 0xc9a84c, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false,
});
const glow2 = new THREE.Mesh(glow2Geo, glow2Mat);
mainGroup.add(glow2);

// Floating ambient particles around the structure
const ambientGeo = new THREE.BufferGeometry();
const ambientPos = [], ambientCol = [];
for (let i = 0; i < 400; i++) {
    const phi = Math.random() * Math.PI * 2;
    const theta = Math.random() * Math.PI;
    const r = 0.5 + Math.random() * 2.2;
    ambientPos.push(
        Math.cos(phi) * Math.sin(theta) * r,
        (Math.random() - 0.5) * 4.5,
        Math.sin(phi) * Math.sin(theta) * r
    );
    const val = 0.7 + Math.random() * 0.3;
    ambientCol.push(val, val * 0.75, val * 0.45);
}
ambientGeo.setAttribute('position', new THREE.Float32BufferAttribute(ambientPos, 3));
ambientGeo.setAttribute('color', new THREE.Float32BufferAttribute(ambientCol, 3));
const ambientCloud = new THREE.Points(ambientGeo, new THREE.PointsMaterial({
    size: 0.025, map: glowTex, blending: THREE.AdditiveBlending,
    depthWrite: false, vertexColors: true, transparent: true, opacity: 0.4,
}));
mainGroup.add(ambientCloud);

// Store references for animation update
const ringPointClouds = [];
const ringLineGroups = []; // {segments: LineSegments, pts: ringData} for each ring
const interLineGroups = []; // {segments: LineSegments, ptsA, ptsB} for inter-ring

let segIdx = 0;
mainGroup.children.forEach(child => {
    if (child.isPoints && child.geometry?.attributes?.position?.count === PARTICLES_PER_RING) {
        ringPointClouds.push(child);
    }
});
// Identify ring lines (first RING_LAYERS LineSegments after point clouds)
let lineCount = 0;
for (const child of mainGroup.children) {
    if (child.isLineSegments && child.geometry?.attributes?.position) {
        const count = child.geometry.attributes.position.count;
        // Ring lines have ~PARTICLES_PER_RING*2 + cross points
        if (count > 500 && lineCount < RING_LAYERS) {
            ringLineGroups.push({ segments: child, ringIdx: lineCount });
            lineCount++;
        } else if (count < 300) {
            interLineGroups.push({ segments: child });
        }
    }
}

// Store per-ring material for opacity pulsing
const ringMaterials = ringPointClouds.map(c => c.material);
const lineMaterials = ringLineGroups.map(g => g.segments.material);

// ============ Animation ============
const clock = new THREE.Clock();
let opacityFade = 0;

function updateRingPositions(time, globalAmp) {
    for (let l = 0; l < RING_LAYERS; l++) {
        const data = allParticleData[l];
        const ptIdx = Math.min(l, ringPointClouds.length - 1);
        const cloud = ringPointClouds[ptIdx];
        if (!cloud) continue;

        const arr = cloud.geometry.attributes.position.array;
        for (let p = 0; p < PARTICLES_PER_RING; p++) {
            const theta = (p / PARTICLES_PER_RING) * Math.PI * 2;
            const r = waveRadius(theta, l, RING_LAYERS - 1, time, globalAmp);
            const localX = Math.cos(theta) * r;
            const localZ = Math.sin(theta) * r;

            const tiltX = data.tiltX, tiltZ = data.tiltZ;
            const cosTX = Math.cos(tiltX), sinTX = Math.sin(tiltX);
            const cosTZ = Math.cos(tiltZ), sinTZ = Math.sin(tiltZ);
            const rx = localX * cosTZ - localZ * sinTZ;
            const rz = localX * sinTZ + localZ * cosTZ;
            const ry = data.baseY + localZ * sinTX;

            const idx = p * 3;
            arr[idx] = rx;
            arr[idx + 1] = ry * cosTX - localZ * sinTX;
            arr[idx + 2] = rz;
            data.ringData[p].x = arr[idx];
            data.ringData[p].y = arr[idx + 1];
            data.ringData[p].z = arr[idx + 2];
        }
        cloud.geometry.attributes.position.needsUpdate = true;

        // Update ring line segments
        const rl = ringLineGroups[l];
        if (rl && rl.segments.geometry.attributes.position) {
            const lineArr = rl.segments.geometry.attributes.position.array;
            const pts = data.ringData;
            let li = 0;
            for (let i = 0; i < pts.length && li + 5 < lineArr.length; i++) {
                const j = (i + 1) % pts.length;
                lineArr[li] = pts[i].x; lineArr[li + 1] = pts[i].y; lineArr[li + 2] = pts[i].z;
                lineArr[li + 3] = pts[j].x; lineArr[li + 4] = pts[j].y; lineArr[li + 5] = pts[j].z;
                li += 6;
                if (i % 8 === 0 && li + 5 < lineArr.length) {
                    const k = (i + 8) % pts.length;
                    lineArr[li] = pts[i].x; lineArr[li + 1] = pts[i].y; lineArr[li + 2] = pts[i].z;
                    lineArr[li + 3] = pts[k].x; lineArr[li + 4] = pts[k].y; lineArr[li + 5] = pts[k].z;
                    li += 6;
                }
            }
            rl.segments.geometry.attributes.position.needsUpdate = true;
        }
    }
}

function animate() {
    requestAnimationFrame(animate);
    const time = performance.now() * 0.001;
    const dt = Math.min(clock.getDelta(), 0.1);

    sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    stars.forEach(s => { s.update(); s.draw(sctx); });
    shootingStars.forEach(s => { s.update(); s.draw(sctx); });

    // Idle auto-drift when no mouse input
    if (Math.abs(targetX) < 0.01 && Math.abs(targetY) < 0.01) {
        targetX = Math.sin(time * 0.3) * 0.15;
        targetY = Math.cos(time * 0.25) * 0.08;
    }
    mouseX += (targetX - mouseX) * 0.02;
    mouseY += (targetY - mouseY) * 0.02;

    mainGroup.rotation.y += 0.002;
    mainGroup.rotation.x = mouseY * 0.4 + 0.08;
    mainGroup.rotation.z = -mouseX * 0.18;

    // Global breath amplitude - all rings pulse together
    const globalAmp = 1 + Math.sin(time * 0.55) * 0.3 + Math.sin(time * 1.2) * 0.14;
    updateRingPositions(time, globalAmp);

    // Per-ring brightness pulsing (staggered)
    for (let l = 0; l < ringMaterials.length; l++) {
        const ringPulse = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(time * 1.3 + l * 0.7));
        ringMaterials[l].opacity = 0.85 * ringPulse * opacityFade;
    }
    for (let l = 0; l < lineMaterials.length; l++) {
        const alpha = 0.12 + (l / RING_LAYERS) * 0.14;
        lineMaterials[l].opacity = alpha * (0.5 + 0.5 * Math.sin(time * 1.5 + l * 0.6)) * opacityFade;
    }

    // Core pulse cascade
    const pulse = 1 + Math.sin(time * 1.6) * 0.2 + Math.sin(time * 3.8) * 0.1;
    core.scale.setScalar(pulse);
    coreMat.opacity = (0.7 + Math.sin(time * 2.5) * 0.3) * opacityFade;
    glow1.scale.setScalar(pulse * 0.85 + 0.15);
    glow1Mat.opacity = (0.2 + Math.sin(time * 1.8) * 0.12) * opacityFade;
    glow2.scale.setScalar(pulse * 0.6 + 0.4);
    glow2.rotation.y += 0.005;
    glow2.rotation.x += 0.002;
    ambientCloud.rotation.y += 0.0015;
    ambientCloud.rotation.x += 0.001;
    ambientCloud.material.opacity = 0.5 * (0.7 + 0.3 * Math.sin(time * 1.1)) * opacityFade;

    opacityFade = Math.min(1, opacityFade + dt * 0.35);

    renderer.render(scene, camera);
}

animate();
</script>
